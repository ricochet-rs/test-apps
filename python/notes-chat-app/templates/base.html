<!DOCTYPE html>
<html lang="uk" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Notes{% endblock %} — CrispyNotes</title>

  <!-- Bootstrap 5 CDN (educational project — no npm/Vite) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  {% load static %}
  <link rel="stylesheet" href="{% static 'notes_app/css/app.css' %}">

  {% block extra_css %}{% endblock %}
</head>
<body>

  {% if user.is_authenticated %}
  <div id="reminder-toast-container"
       class="toast-container position-fixed bottom-0 end-0 p-3"
       style="z-index: 1100;"
       aria-live="polite"
       aria-label="Нагадування">
  </div>
  {% endif %}

  {% block body %}
    {% block content %}{% endblock %}
  {% endblock %}

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>window.SCRIPT_NAME = "{{ request.META.SCRIPT_NAME|escapejs }}";</script>

  {% if user.is_authenticated %}
  <script src="{% static 'notes_app/js/reminders.js' %}"></script>
  {% endif %}

  {% block extra_js %}{% endblock %}
</body>
</html>
