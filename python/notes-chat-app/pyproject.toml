[project]
name = "notes-chat-app"
version = "0.1.0"
description = "Run the notes_chat_app Django project with SQLite on persistent storage."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.3",
    "channels>=4.0",
    "channels-redis>=4.0",
    "crispy-bootstrap5>=2024.2",
    "daphne>=4.0",
    "django>=5.2,<6.0",
    "django-crispy-forms>=2.3",
    "django-debug-toolbar>=4.0",
    "djangorestframework>=3.16",
    "httpx>=0.27.0",
    "pyjwt[crypto]>=2.9",
    "uvicorn>=0.30.0",
    "wsproto>=1.2.0",
]

[dependency-groups]
dev = [
    "coverage>=7.0",
    "pytest>=7.0",
    "pytest-django>=4.5",
    "selenium>=4.6.0",
]
