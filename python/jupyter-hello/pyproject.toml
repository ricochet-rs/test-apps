[project]
name = "jupyter-hello"
version = "0.1.0"
description = "Summarize and plot the Palmer penguins dataset with plotnine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "palmerpenguins>=0.1.6",
    "plotnine>=0.15.8",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "nbconvert>=7.16.6",
]
